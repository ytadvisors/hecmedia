name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    # Known gap (see TESTING.md "CI known gaps"): this repo has 6 pre-existing eslint
    # errors unrelated to Phase 1 testing-infra work. Non-blocking until a follow-up
    # lint-cleanup task lands; flip to blocking once yarn lint exits 0 on master.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
      # --ignore-scripts: node-sass@7.0.1 (EOL) cannot build its native binding
      # against Node 22's V8 API on any platform (see TESTING.md "CI known gaps").
      # Safe to skip here — eslint is pure JS and never touches node-sass.
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: yarn lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
      # --ignore-scripts: see comment in the lint job above. Jest mocks all
      # .scss/.css imports (package.json `jest.moduleNameMapper`), so the test
      # suite never loads node-sass's native binding either.
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: yarn test
