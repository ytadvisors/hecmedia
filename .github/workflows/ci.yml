name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
      # --ignore-scripts: node-sass@7.0.1 (EOL) cannot build its native binding
      # against Node 22's V8 API on any platform (see TESTING.md "CI known gaps").
      # Safe to skip here — eslint is pure JS and never touches node-sass.
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: yarn lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
      # --ignore-scripts: see comment in the lint job above. Jest mocks all
      # .scss/.css imports (package.json `jest.moduleNameMapper`), so the test
      # suite never loads node-sass's native binding either.
      #
      # `yarn test` runs Jest with `collectCoverage: true` and a `coverageThreshold`
      # (package.json `jest` block) — Jest itself exits non-zero when a threshold
      # is missed, so a coverage regression fails this job with no extra wiring.
      # See TESTING.md "Coverage policy: the ratchet".
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: yarn test

  # E2E contracts hit a live WPGraphQL/REST target.  Fork PRs and repositories
  # without the protected endpoint secrets must remain green without silently
  # falling back to the production defaults, so the step explicitly no-ops
  # unless both endpoints are configured.
  e2e:
    needs: test
    runs-on: ubuntu-latest
    env:
      APOLLO_CLIENT_URI: ${{ secrets.HECMEDIA_E2E_APOLLO_CLIENT_URI }}
      GATSBY_WP_HOST: ${{ secrets.HECMEDIA_E2E_WP_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
      - run: yarn install --frozen-lockfile --ignore-scripts
      - name: Run read-only API contracts when endpoints are configured
        run: |
          if [ -z "$APOLLO_CLIENT_URI" ] || [ -z "$GATSBY_WP_HOST" ]; then
            echo "::warning::HECMEDIA_E2E_APOLLO_CLIENT_URI and HECMEDIA_E2E_WP_HOST are required; skipping e2e contracts."
            exit 0
          fi
          yarn test:e2e

  # Preview deploy target: development.hecmedia.org (shared staging URL, already
  # live per phase0-D3-access-and-preview.md — reused rather than provisioning a
  # true per-branch/per-PR subdomain, which needs an unverified ACM wildcard-cert
  # check first, see D3 §2). Deploy-capable AWS creds are human-gated by design
  # (D3 §3) and are not present as repo secrets today, so this job no-ops with a
  # warning until a human adds them + Yomi approves an actual deploy.
  preview-deploy:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'
    needs: [test, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
      - run: yarn install --frozen-lockfile --ignore-scripts
      - name: Deploy preview (development.hecmedia.org)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.HECMEDIA_DEPLOY_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HECMEDIA_DEPLOY_AWS_SECRET_ACCESS_KEY }}
          SUBDOMAIN: development
          DOMAIN: hecmedia.org
          APOLLO_CLIENT_URI: ${{ secrets.APOLLO_CLIENT_URI }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::warning::No deploy-capable AWS credentials configured (HECMEDIA_DEPLOY_AWS_ACCESS_KEY_ID secret unset). Skipping preview deploy — see phase0-D3-access-and-preview.md, deploy creds are human-gated by design."
            exit 0
          fi
          yarn deploy
