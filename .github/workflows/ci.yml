name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "yarn"
      - run: yarn install --frozen-lockfile
      - run: yarn lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "yarn"
      # `yarn test` runs Jest with `collectCoverage: true` and a `coverageThreshold`
      # (package.json `jest` block) — Jest itself exits non-zero when a threshold
      # is missed, so a coverage regression fails this job with no extra wiring.
      # See TESTING.md "Coverage policy: the ratchet".
      - run: yarn install --frozen-lockfile
      - run: yarn test

  # E2E contracts hit a live WPGraphQL/REST target.  Fork PRs and repositories
  # without the protected endpoint secrets must remain green without silently
  # falling back to the production defaults, so the step explicitly no-ops
  # unless both endpoints are configured.
  e2e:
    needs: test
    runs-on: ubuntu-latest
    env:
      APOLLO_CLIENT_URI: ${{ secrets.HECMEDIA_E2E_APOLLO_CLIENT_URI }}
      GATSBY_WP_HOST: ${{ secrets.HECMEDIA_E2E_WP_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "yarn"
      - run: yarn install --frozen-lockfile
      - name: Run read-only API contracts when endpoints are configured
        run: |
          if [ -z "$APOLLO_CLIENT_URI" ] || [ -z "$GATSBY_WP_HOST" ]; then
            echo "::warning::HECMEDIA_E2E_APOLLO_CLIENT_URI and HECMEDIA_E2E_WP_HOST are required; skipping e2e contracts."
            exit 0
          fi
          yarn test:e2e

  # Preserve the historical check name without granting pull requests a deploy
  # path. Staging publishes are explicit workflow_dispatch runs of the governed
  # staging workflow after review; CI only verifies that entrypoint is present.
  preview-deploy:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'
    needs: [test, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "yarn"
      - run: yarn install --frozen-lockfile
      - name: Verify preview publishing remains governed
        run: |
          set -euo pipefail
          test -f .github/workflows/staging-deploy.yml
          grep -q 'workflow_dispatch:' .github/workflows/staging-deploy.yml
          echo "Preview publish is manual through the governed staging workflow."
