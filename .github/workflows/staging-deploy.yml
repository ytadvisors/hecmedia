name: HEC Media staging deployment

on:
  workflow_dispatch:
    inputs:
      action:
        description: Deploy a commit or roll back to the last known-good staging SHA.
        required: true
        type: choice
        options: [deploy, rollback]
      ref:
        description: Commit SHA to deploy. Required for deploy; ignored for rollback.
        required: false
        type: string

permissions:
  contents: write
  id-token: write

# Runs are serialized rather than cancelled. An always-run evidence step records
# manual cancellation or failure, so it cannot be mistaken for success.
concurrency:
  group: hecmedia-staging-deployment
  cancel-in-progress: false

env:
  STAGING_SITE_URL: https://development.hecmedia.org
  STAGING_SUBDOMAIN: development
  STAGING_DOMAIN: hecmedia.org

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - name: Require Yomi approval
        env:
          DISPATCH_ACTOR: ${{ github.actor }}
        run: |
          if [ "$DISPATCH_ACTOR" != "ytwguru" ]; then
            echo "::error title=Staging approval required::Only ytwguru may authorize an HEC Media staging deployment."
            exit 1
          fi

  deploy-and-verify:
    needs: authorize
    runs-on: ubuntu-latest
    environment:
      name: hecmedia-staging
      url: https://development.hecmedia.org
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve staging-only revision
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          ref='${{ inputs.ref }}'
          if [ '${{ inputs.action }}' = rollback ]; then ref=staging-last-known-good; fi
          if [ -z "$ref" ]; then echo "A commit SHA is required for deploy." >&2; exit 1; fi
          git rev-parse --verify "$ref^{commit}"
          git checkout --detach "$ref"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: yarn
      - name: Preflight staging configuration by name only
        env:
          HECMEDIA_STAGING_AWS_ROLE_ARN: ${{ secrets.HECMEDIA_STAGING_AWS_ROLE_ARN }}
          HECMEDIA_STAGING_APOLLO_CLIENT_URI: ${{ secrets.HECMEDIA_STAGING_APOLLO_CLIENT_URI }}
          HECMEDIA_STAGING_WP_HOST: ${{ secrets.HECMEDIA_STAGING_WP_HOST }}
          HECMEDIA_STAGING_CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.HECMEDIA_STAGING_CLOUDFRONT_DISTRIBUTION_ID }}
          HECMEDIA_NO_SEND_FORMS: "true"
          HECMEDIA_NAVIGATION_PREVIEW: "true"
          HECMEDIA_TOPBAR_CTA_PREVIEW: "true"
          HECMEDIA_DISABLE_IMAGE_OPTIMIZER: "true"
        run: |
          set -euo pipefail
          for name in HECMEDIA_STAGING_AWS_ROLE_ARN HECMEDIA_STAGING_APOLLO_CLIENT_URI HECMEDIA_STAGING_WP_HOST HECMEDIA_STAGING_CLOUDFRONT_DISTRIBUTION_ID; do
            if [ -z "${!name:-}" ]; then echo "::error title=Missing staging configuration::$name is required in the hecmedia-staging environment"; exit 1; fi
            echo "$name is configured"
          done
          test "$STAGING_SITE_URL" = "https://development.hecmedia.org"
          test "$STAGING_SUBDOMAIN" = development
          test "$STAGING_DOMAIN" = hecmedia.org
          test "$HECMEDIA_NO_SEND_FORMS" = true
          test "$HECMEDIA_NAVIGATION_PREVIEW" = true
          test "$HECMEDIA_TOPBAR_CTA_PREVIEW" = true
          test "$HECMEDIA_DISABLE_IMAGE_OPTIMIZER" = true
      # Build on the same supported runtime configured for the staging Lambda.
      # Dart Sass replaces the retired native node-sass binding, so installation
      # and the real Next.js build both run on Node 24 without engine bypasses.
      - run: yarn install --frozen-lockfile
      - name: Lint and Jest coverage
        run: yarn lint && yarn test
      - name: Read-only API contracts
        env:
          APOLLO_CLIENT_URI: ${{ secrets.HECMEDIA_STAGING_APOLLO_CLIENT_URI }}
          GATSBY_WP_HOST: ${{ secrets.HECMEDIA_STAGING_WP_HOST }}
          E2E_ALLOW_WRITES: "0"
        run: yarn test:e2e
      - name: Package Next.js app for Lambda@Edge (no AWS calls)
        env:
          # Next.js 9 bundles webpack 4, whose MD4 build hash needs the legacy
          # OpenSSL provider on modern Node. Build-time only; not in Lambda.
          NODE_OPTIONS: --openssl-legacy-provider
          DEPLOY_SHA: ${{ steps.revision.outputs.sha }}
          APOLLO_CLIENT_URI: ${{ secrets.HECMEDIA_STAGING_APOLLO_CLIENT_URI }}
          WP_HOST: ${{ secrets.HECMEDIA_STAGING_WP_HOST }}
          HECMEDIA_NO_SEND_FORMS: "true"
          HECMEDIA_NAVIGATION_PREVIEW: "true"
          HECMEDIA_TOPBAR_CTA_PREVIEW: "true"
          HECMEDIA_DISABLE_IMAGE_OPTIMIZER: "true"
          RE_CAPTCHA_SITE_KEY: ${{ secrets.HECMEDIA_STAGING_RECAPTCHA_SITE_KEY }}
        run: |
          test -n "$RE_CAPTCHA_SITE_KEY"
          node scripts/staging-deploy.js build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.HECMEDIA_STAGING_AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Deploy to existing staging resources (scoped update, no create/IAM/Route53)
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.HECMEDIA_STAGING_CLOUDFRONT_DISTRIBUTION_ID }}
        run: node scripts/staging-deploy.js deploy
      - name: Verify rendered site, routes, no-send forms, and CloudFront alias
        env:
          DEPLOY_SHA: ${{ steps.revision.outputs.sha }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.HECMEDIA_STAGING_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          aws cloudfront get-distribution --id "$CLOUDFRONT_DISTRIBUTION_ID" --query 'Distribution.DistributionConfig.Aliases.Items' --output text > cloudfront-aliases.txt
          CLOUDFRONT_ALIASES="$(tr '\t' ',' < cloudfront-aliases.txt)" node scripts/verify-staging.js | tee staging-verification.json
          BROWSER_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$BROWSER_BIN"
          timeout 60 "$BROWSER_BIN" --headless --no-sandbox --disable-gpu --enable-logging=stderr --v=1 --virtual-time-budget=5000 --dump-dom "$STAGING_SITE_URL/" > staging-hydrated-home.html 2> staging-browser-console.log
          grep -q 'Trending Now' staging-hydrated-home.html
          if grep -q '>404 not found\.<' staging-hydrated-home.html; then
            echo "::error title=Hydration failed::The hydrated staging DOM collapsed to 404 not found."
            exit 1
          fi
          timeout 60 "$BROWSER_BIN" --headless --no-sandbox --disable-gpu --enable-logging=stderr --v=1 --virtual-time-budget=5000 --dump-dom "$STAGING_SITE_URL/category/films" > staging-hydrated-category.html 2>> staging-browser-console.log
          grep -q 'Films' staging-hydrated-category.html
          if grep -q '>404 not found\.<' staging-hydrated-category.html; then
            echo "::error title=Hydration failed::The hydrated category DOM collapsed to 404 not found."
            exit 1
          fi
          if grep -Eqi 'incompatible-href-as|provided .as. value.*incompatible' staging-browser-console.log; then
            echo "::error title=Dynamic route failed::A hydrated route emitted an incompatible href/as error."
            exit 1
          fi
          if grep -Eqi 'Uncaught (\(in promise\) )?TypeError|TypeError:|Uncaught Error' staging-browser-console.log; then
            echo "::error title=Hydration failed::A hydrated route emitted an uncaught JavaScript error."
            exit 1
          fi
      - name: Record last known-good staging SHA
        if: success()
        env:
          SHA: ${{ steps.revision.outputs.sha }}
        run: |
          git tag -f staging-last-known-good "$SHA"
          git push --force origin refs/tags/staging-last-known-good
      - name: Write deploy evidence
        if: always()
        env:
          SHA: ${{ steps.revision.outputs.sha }}
        run: |
          printf '{"target":"https://development.hecmedia.org","sha":"%s","action":"%s","outcome":"%s"}\n' "$SHA" '${{ inputs.action }}' '${{ job.status }}' > staging-deploy-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hecmedia-staging-evidence-${{ github.run_id }}
          path: |
            staging-deploy-evidence.json
            staging-verification.json
            cloudfront-aliases.txt
            staging-browser-console.log
            staging-hydrated-home.html
            staging-hydrated-category.html
          if-no-files-found: warn
