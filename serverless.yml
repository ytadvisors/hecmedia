service: hecmedia

provider:
  name: aws
  runtime: nodejs10.x
  region: us-east-2
  profile: eb-cli2
  stage: ${opt:stage}

plugins:
  - serverless-nextjs-plugin
  - serverless-offline

custom:
  stage: ${opt:stage, self:provider.stage}
  serverless-nextjs:
    createAssetBucket: false
    cloudFront: true
    routes:
      - src: posts
        path: posts/{slug}
        request:
          parameters:
            paths:
              slug: true
      - src: magazine
        path: magazine/{slug}
        request:
          parameters:
            paths:
              slug: true
      - src: category
        path: category/{proxy+}
        request:
          parameters:
            paths:
              proxy: true

package:
  # exclude everything
  # page handlers are automatically included by the plugin
  exclude:
    - ./**
