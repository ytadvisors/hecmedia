nextApp:
  component: "@sls-next/serverless-component@1.19.1-patch.1"
  inputs:
    timeout:
      defaultLambda: 30
    env:
      APOLLO_CLIENT_URI: ${env.APOLLO_CLIENT_URI}
    domain:
      - ${env.SUBDOMAIN}
      - ${env.DOMAIN}
    logLambdaExecutionTimes: true
    memory: 3000
    cloudfront:
      # this is the default cache behaviour of the cloudfront distribution
      # the origin-request edge lambda associated to this cache behaviour does the pages server side rendering
      defaults:
        minTTL: 0
        maxTTL: 0
        defaultTTL: 0
        forward:
          headers:
            [
              CloudFront-Is-Desktop-Viewer,
              CloudFront-Is-Mobile-Viewer,
              CloudFront-Is-Tablet-Viewer,
            ]
    errorPages:
      - code: 503
        path: "/index.html"
        minTTL: 5 # optional, minimum ttl the error is cached (default 10)
        responseCode: 500 # optional, alters the response code