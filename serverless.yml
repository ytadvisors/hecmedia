name: ${env.APP_NAME}

nextApp:
  component: "@sls-next/serverless-component@1.19.0-alpha.21"
  inputs:
    timeout:
      defaultLambda: 30
    env:
      APOLLO_CLIENT_URI: ${env.APOLLO_CLIENT_URI}
    domain:
      - ${env.SUBDOMAIN}
      - ${env.DOMAIN}
    logLambdaExecutionTimes: true
    memory: 3000
